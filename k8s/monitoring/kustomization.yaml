apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-provisioning
    files:
      - datasource.yaml
      - dashboards.yaml
  - name: grafana-dashboards
    files:
      - wind-api.json

name: Deploy to EC2

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '**/*.md'
      - '.gitignore'

# id-token lets the job request a GitHub OIDC token; no AWS keys or SSH keys are stored.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          # Runs as root on the instance; git runs as ubuntu, who owns the checkout.
          read -r -d '' SCRIPT <<EOF || true
          set -e
          APP_DIR="/home/ubuntu/short-time-wind-energy-forecasting-system"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          # 0) Ensure dependencies
          apt-get update -y
          apt-get install -y git docker.io
          systemctl enable --now docker

          # 1) First-time clone (public repo)
          if [ ! -d "\$APP_DIR/.git" ]; then
            rm -rf "\$APP_DIR"
            sudo -u ubuntu -H git clone "\$REPO_URL" "\$APP_DIR"
          fi

          # 2) Check out exactly the commit that triggered this run
          cd "\$APP_DIR"
          sudo -u ubuntu -H git fetch origin master
          sudo -u ubuntu -H git reset --hard "${GITHUB_SHA}"

          # 3) Build & run
          docker build -f fastapi-app/Dockerfile -t wind-api .
          docker stop wind-api || true
          docker rm wind-api || true
          docker run -d --restart unless-stopped --name wind-api -p 80:8000 wind-api
          EOF

          PARAMS=$(jq -n --arg s "$SCRIPT" '{commands: [$s], executionTimeout: ["1800"]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Building on a t3.micro can exceed the 100s built-in waiter, so poll for up to 30 min.
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 60
          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
